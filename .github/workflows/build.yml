name: build

on: push

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    container: golang:1.24
    steps:
      - uses: actions/checkout@v7
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi
      - name: vet
        run: |
          go vet ./...
          GOOS=windows CGO_ENABLED=0 go vet ./...
      - name: test
        run: go test ./...
